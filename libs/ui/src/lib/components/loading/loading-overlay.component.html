@if (loading()) {
  @if (type() === 'skeleton') {
    @for (row of rowsArray(); track row) {
      <div class="mb-2">
        <p-skeleton height="2.5rem"></p-skeleton>
      </div>
    }
  } @else {
    <div class="flex justify-content-center align-items-center py-6">
      <p-progressSpinner strokeWidth="3" class="w-4rem h-4rem"></p-progressSpinner>
    </div>
  }
} @else {
  <ng-content></ng-content>
}
