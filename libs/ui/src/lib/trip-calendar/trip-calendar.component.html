<p-datepicker
  [inline]="true"
  [minDate]="minDate"
  [(ngModel)]="selectedDateObj"
  (onSelect)="onSelect($event)"
  styleClass="trip-cal"
  [panelStyle]="{ width: '100%', boxSizing: 'border-box' }"
  [showOtherMonths]="true"
  [selectOtherMonths]="true"
  >
  <ng-template pTemplate="date" let-date>
    <span
      class="date-cell flex flex-column align-items-center justify-content-center"
      [class.has-event]="eventMap().has(dateKey(date))"
      [pTooltip]="tooltipMap().get(dateKey(date)) ?? ''"
      tooltipPosition="top"
      (dblclick)="eventMap().has(dateKey(date)) && onDblClick(date)"
      >
      <span class="day-number">{{ date.day }}</span>
    </span>
  </ng-template>
</p-datepicker>
