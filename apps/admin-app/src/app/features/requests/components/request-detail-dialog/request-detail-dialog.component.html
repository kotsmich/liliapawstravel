<p-dialog
  [header]="'requests.detail.header' | transloco"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '95vw', height: '95vh' }"
  [contentStyle]="{ overflowY: 'auto', height: '100%' }"
  [draggable]="false">

  @if (request(); as req) {
    <div class="content-actions">
      <p-button
        [label]="'requests.detail.approve' | transloco"
        icon="pi pi-check"
        severity="success"
        [disabled]="req.status !== 'pending'"
        (onClick)="approve.emit()" />
      <p-button
        [label]="'requests.detail.reject' | transloco"
        icon="pi pi-times"
        severity="danger"
        [outlined]="true"
        [disabled]="req.status !== 'pending'"
        (onClick)="reject.emit()" />
    </div>
    <p class="request-summary">
      {{ 'requests.detail.requestFor' | transloco: { trip: tripDate(req.tripId), requester: req.requesterName } }}
    </p>

    <app-request-info-grid [req]="req" [tripDateLabel]="tripDate(req.tripId)" />

    <div class="dogs-section">
      <h3>{{ 'requests.detail.dogsSection' | transloco: { count: (req.dogs?.length ?? 0) } }}</h3>
      <div class="table-wrapper">
        <app-generic-table
          [data]="req.dogs ?? []"
          [columns]="dogColumns()"
          [config]="dogConfig()">
        </app-generic-table>
      </div>
    </div>

    <app-internal-note-editor
      [entityId]="req.id"
      [note]="req.adminNote ?? ''"
      (noteSaved)="saveNote.emit($event)" />
  }

  
  <ng-template pTemplate="footer">
    <p-button
    [label]="'requests.detail.cancel' | transloco"
    severity="secondary"
    [outlined]="true"
    (onClick)="cancel.emit()" />
  </ng-template>
</p-dialog>

<app-request-preview-dialog
  [header]="previewHeader()"
  [url]="previewUrl()"
  [visible]="previewVisible()"
  (visibleChange)="previewVisible.set($event)" />
