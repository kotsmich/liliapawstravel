<p-dialog
  [header]="header()"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '98vw', height: '90vh' }"
  [contentStyle]="{ flex: '1 1 auto', minHeight: '0', overflow: 'hidden', display: 'flex', flexDirection: 'column' }"
  [draggable]="false"
  styleClass="trip-detail-dialog dialog-tall"
  (onHide)="onHide()">

  @if (loading()) {
    <div class="dialog-spinner-center">
      <ui-loading-spinner />
    </div>
  } @else if (trip()) {
    <app-trip-dogs-tabs
      [tripId]="trip()?.id ?? null"
      [showAddButton]="true"
      [showFinances]="true"
      [requests]="requests()"
      (rowClicked)="openDogDetail($event)" />
  }
</p-dialog>

<app-dog-detail-dialog
  [visible]="dogDetailVisible()"
  [dog]="selectedDog()"
  [requester]="selectedRequester()"
  (visibleChange)="dogDetailVisible.set($event)">
</app-dog-detail-dialog>
