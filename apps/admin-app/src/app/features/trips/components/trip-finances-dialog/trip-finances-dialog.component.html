<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '70vw', height: '90vh' }"
  [breakpoints]="{ '960px': '95vw' }"
  [contentStyle]="{ flex: '1 1 auto', minHeight: '0', overflow: 'hidden', display: 'flex', flexDirection: 'column' }"
  [draggable]="false"
  styleClass="trip-finances-dialog"
  (onHide)="onHide()">

  <!-- Custom header rather than [header]: the refresh control has to sit next
       to the title, and PrimeNG only renders the plain title when no template. -->
  <ng-template #header>
    <div class="finances-dialog-header">
      <span class="finances-dialog-header__title">{{ headerText() }}</span>
      <p-button icon="pi pi-refresh" severity="secondary" [text]="true" [rounded]="true" size="small"
        [disabled]="!trip()" [loading]="refreshing()"
        [pTooltip]="'common.refresh' | transloco" tooltipPosition="bottom"
        [ariaLabel]="'common.refresh' | transloco"
        (onClick)="refresh()" />
    </div>
  </ng-template>

  @if (loading() && !trip()) {
    <div class="dialog-spinner-center">
      <ui-loading-spinner />
    </div>
  } @else if (visible() && trip(); as loadedTrip) {
    <app-trip-finances [tripId]="loadedTrip.id" [requesters]="loadedTrip.requesters ?? []" />
  }
</p-dialog>
