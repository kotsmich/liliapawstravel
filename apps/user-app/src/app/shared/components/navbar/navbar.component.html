<nav class="navbar" [class.scrolled]="scrolled()" [attr.aria-label]="'aria.mainNav' | transloco">
  <div class="navbar__container flex align-items-center justify-content-between">
    <a class="navbar__brand flex align-items-center" [routerLink]="linkService.commands('/')" (click)="closeMenu()">
      @if (scrolled()) {
        <img class="navbar__logo" src="assets/images/paws-logo.webp" alt="" width="65" height="65" />
      }
      <span class="navbar__name">Lilia Paws Travel</span>
    </a>
    <ul class="navbar__links flex align-items-center" [class.open]="menuOpen()" role="menubar">
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/')" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">{{ 'nav.home' | transloco }}</a></li>
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/about')" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.about' | transloco }}</a></li>
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/request')" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.requestTransport' | transloco }}</a></li>
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/transport-documents')" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.transportDocuments' | transloco }}</a></li>
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/faq')" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.faq' | transloco }}</a></li>
      <li role="none"><a role="menuitem" [routerLink]="linkService.commands('/contact')" routerLinkActive="active" (click)="closeMenu()">{{ 'nav.contact' | transloco }}</a></li>
    </ul>
    <div class="navbar__right">
      <app-language-switcher />
      <button class="navbar__burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" [attr.aria-label]="'aria.toggleNav' | transloco">
        <i class="pi" [ngClass]="menuOpen() ? 'pi-times' : 'pi-bars'"></i>
      </button>
    </div>
  </div>
</nav>
