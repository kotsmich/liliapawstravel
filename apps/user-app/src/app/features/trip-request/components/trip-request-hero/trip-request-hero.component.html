<div class="page-intro">
  <div class="page-intro__bg" aria-hidden="true">
    <img
      ngSrc="assets/images/request-hero.webp"
      alt=""
      fill
      priority
      sizes="100vw"
    />
    <div class="page-intro__bg-overlay"></div>
  </div>

  <div class="page-intro__inner">
    <span class="page-eyebrow">{{ 'tripRequest.tag' | transloco }}</span>
    <h1>
      <img class="page-intro__logo" src="assets/images/paws-logo.webp" alt="" width="56" height="56" />
      {{ 'tripRequest.title' | transloco }}
    </h1>
    <p>{{ 'tripRequest.subtitle' | transloco }}</p>
  </div>
  <div class="page-intro__rule" aria-hidden="true"></div>
</div>
