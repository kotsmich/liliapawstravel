<section class="not-found">
  <div class="not-found__inner">
    <p class="not-found__code" aria-hidden="true">404</p>
    <h1 class="not-found__heading">{{ 'notFound.heading' | transloco }}</h1>
    <p class="not-found__body">{{ 'notFound.body' | transloco }}</p>
    <a [routerLink]="['/', lang]" class="not-found__cta">
      {{ 'notFound.backHome' | transloco }}
    </a>
  </div>
</section>
