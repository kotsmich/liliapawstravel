<div class="page faq-page">

  <!-- ══════════════════════════════════════════════════════
       PAGE HERO
       ══════════════════════════════════════════════════════ -->
  <header class="page-intro" aria-label="Frequently asked questions">
    <div class="page-intro__bg-overlay"></div>
    <div class="page-intro__inner">
      <span class="page-eyebrow">{{ 'faqPage.eyebrow' | transloco }}</span>
      <h1>
        <img class="page-intro__logo" src="assets/images/paws-logo.webp" alt="" width="56" height="56" />
        {{ 'faqPage.title' | transloco }}
      </h1>
      <p>{{ 'faqPage.subtitle' | transloco }}</p>
    </div>
    <div class="page-intro__rule" aria-hidden="true"></div>
  </header>

  <!-- ══════════════════════════════════════════════════════
       FAQ
       ══════════════════════════════════════════════════════ -->
  <section class="faq" aria-label="Questions and answers">
    <div class="faq__grid">
      <app-faq-accordion [items]="group1Items" titleKey="faq.group1.title" />
      <app-faq-accordion [items]="group2Items" titleKey="faq.group2.title" />
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       CTA
       ══════════════════════════════════════════════════════ -->
  <app-cta-section (requestClicked)="goToRequest()" (contactClicked)="goToContact()" />

</div>
