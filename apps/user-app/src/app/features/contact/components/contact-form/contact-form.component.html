<div class="form-wrapper contact-form">
  @if (success()) {
    <div class="feedback success flex align-items-start flex-wrap gap-3">
      <i class="pi pi-check-circle"></i>
      <div>
        <h3>{{ 'contact.form.successTitle' | transloco }}</h3>
        <p>{{ 'contact.form.successMsg' | transloco }}</p>
      </div>
      <p-button [label]="'contact.form.sendAnother' | transloco" [outlined]="true" severity="success" (onClick)="reset.emit()" />
    </div>
  }
  @if (error()) {
    <p-message severity="error" [text]="'Error: ' + error()" styleClass="mb-3" />
  }

  @if (!success()) {
    <form focusInvalidInput [formGroup]="form()" (ngSubmit)="formSubmit.emit()" novalidate>
      <div class="fields-row">
        <div class="field field--full-width">
          <p-ifta-label>
            <input pInputText id="name" formControlName="name" />
            <label for="name">{{ 'contact.form.fullName' | transloco }}</label>
          </p-ifta-label>
          <small class="p-error" *appValidationError="form().get('name')">{{ errorFor('name') }}</small>
        </div>
        <div class="field field--full-width">
          <p-ifta-label>
            <input pInputText id="email" formControlName="email" type="email" />
            <label for="email">{{ 'contact.form.email' | transloco }}</label>
          </p-ifta-label>
          <small class="p-error" *appValidationError="form().get('email')">{{ errorFor('email') }}</small>
        </div>
      </div>
      <div class="fields-row">
        <div class="field field--full-width">
          <p-ifta-label>
            <input pInputText id="phone" formControlName="phone" type="tel" />
            <label for="phone">{{ 'contact.form.phone' | transloco }}</label>
          </p-ifta-label>
          <small class="p-error" *appValidationError="form().get('phone')">{{ errorFor('phone') }}</small>
        </div>
        <div class="field field--full-width">
          <p-ifta-label>
            <input pInputText id="subject" formControlName="subject" />
            <label for="subject">{{ 'contact.form.subject' | transloco }}</label>
          </p-ifta-label>
          <small class="p-error" *appValidationError="form().get('subject')">{{ errorFor('subject') }}</small>
        </div>
      </div>
      <div class="field field--full-width message-field">
        <p-ifta-label>
          <textarea pTextarea id="message" formControlName="message" rows="6"></textarea>
          <label for="message">{{ 'contact.form.message' | transloco }}</label>
        </p-ifta-label>
        <small class="p-error" *appValidationError="form().get('message')">{{ errorFor('message') }}</small>
      </div>
      <div class="submit-row">
        <p-button
          appAsyncButton
          [asyncLoading]="loading()"
          type="submit"
          [label]="loading() ? ('contact.form.sending' | transloco) : ('contact.form.send' | transloco)"
          />
      </div>
    </form>
  }
</div>
